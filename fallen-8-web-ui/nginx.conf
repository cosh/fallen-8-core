# F8 Studio standalone static server (feature standalone-ui). Serves the built SPA with a
# client-side-routing fallback, ships the bundled sample datasets at /samples, and applies the
# cache policy the runtime config seam needs. Replaces the stock /etc/nginx/conf.d/default.conf;
# the http-level `include /etc/nginx/mime.types;` from the base image's nginx.conf still applies.
server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # The runtime endpoint file is rewritten from F8_API_URL at container start, so it must never
    # be cached: a cached copy would keep pointing the browser at the previous data plane after a
    # redeploy.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    # The SPA shell references content-hashed assets under /assets. The shell itself must
    # revalidate (so a cached shell never references purged asset hashes after a redeploy); the
    # hashed assets are immutable and cached hard.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Bundled sample datasets (feature sample-graphs): NDJSON served as static files. This regex
    # location only sets the Content-Type the apiApp/dev server use (.jsonl is not in the stock
    # mime map); it is Content-Type parity, not a hard requirement, since the client reads samples
    # as blobs. A missing .jsonl 404s here rather than falling back to the SPA shell.
    location ~ \.jsonl$ {
        default_type application/x-ndjson;
    }

    # Same parity for the ingestable sample documents (feature knowledge-demo): .md is not in the
    # stock mime map either. .pdf and .xlsx are, and the loader ingests binaries as blobs and text
    # as text() regardless, so this too is parity rather than a requirement.
    location ~ \.md$ {
        default_type text/markdown;
    }

    # SPA deep-link fallback: serve a real file or directory first (so /samples/* and /assets/* are
    # served as-is), otherwise return the client-routed shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
