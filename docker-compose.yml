# The complete F8 environment as ONE unit: engine + API + F8 Studio UI in one container,
# plus the NL-assist model backend (Ollama with phi4-mini base + phi4-f8-mini fine-tune;
# the larger full-Phi-4 fine-tune phi4-f8 is opt-in - feature delegate-model-variants).
# Manage the environment as a whole - not individual containers:
#
#   npm run env:up                   # start everything (detects NVIDIA GPU automatically)
#   npm run env:up:published         # same, but from the published GHCR images (no builds)
#   F8_GPU=0 npm run env:up          # force CPU-only mode (no GPU acceleration)
#   F8_GPU=1 npm run env:up          # force GPU mode (fails if no NVIDIA GPU + toolkit)
#   npm run env:down                 # stop everything; named volumes persist
#   npm run env:logs                 # follow the whole environment
#   npm run env:status               # check running status
#
# F8 itself bundles no model weights or runtime (nl-assist spec FR-26.2) - Ollama and the
# weights are pulled ON THIS MACHINE from their upstream registries; their MIT licenses
# bind the user running them.
#
# GPU acceleration is automatic: npm run env:up detects your host's NVIDIA GPU and applies
# GPU settings automatically. To override:
#   - Force GPU off (CPU-only):  F8_GPU=0 npm run env:up
#   - Force GPU on (NVIDIA):     F8_GPU=1 npm run env:up
#
# For AMD GPUs, use the Ollama rocm image manually (not yet covered by this compose).
#
#   F8 Studio:  http://localhost:8080
#   NL assist:  endpoint http://localhost:11434, api kind "ollama". The UI defaults to the
#               fine-tuned "phi4-f8-mini" model (nl-assist-finetune). Override its pull source
#               via F8_DELEGATE_REPO. The larger GPU-only "phi4-f8" (source F8_PHI4F8_REPO,
#               ~9GB) is pulled by default too; set F8_PULL_PHI4F8=0 to skip it on a
#               CPU-only or disk-constrained host.
#   Embeddings: text-in embedding, semantic search and queryText traversal work out of the
#               box - the same Ollama sidecar serves bge-m3 (MIT). Opt out with
#               F8_EMBEDDINGS=false. Docs: features/done/embedding-provider/README.md.

# First-party services declare BOTH image: (the GHCR name release.yml publishes on every
# vX.Y.Z tag; F8_IMAGE_TAG pins a version, default latest) AND build: (the dev fallback -
# `npm run env:up` builds locally, `npm run env:up:published` runs purely from the
# published images). Third-party images are pinned to exact versions.

services:
  fallen8:
    image: ghcr.io/cosh/fallen-8-core:${F8_IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    # Give the clean-shutdown checkpoint time to write + register before SIGKILL (compose's
    # default grace is 10s; a large graph's save can take longer). If it is still killed,
    # committed writes are recovered from the WAL on the next boot.
    stop_grace_period: 60s
    ports:
      # Host port is configurable (F8_PORT) so the environment does not collide with
      # something already on 8080; the container always listens on 8080.
      - "${F8_PORT:-8080}:8080"
    environment:
      # Durable graph data AND the save-game registry live on the named volume, so both
      # survive container recreation together (feature save-games).
      - Fallen8__Durability__StorageDirectory=/data
      - Fallen8__Metadata__Directory=/data/metadata
      # Opt-in security posture; set a real key before exposing beyond localhost. (Dynamic code
      # execution is always on — the "queries are C#" model — so there is no switch for it; set an
      # API key before exposing the server, since the compile endpoints run in-process code.)
      - Fallen8__Security__ApiKey=${F8_API_KEY:-}
      # Text-in embeddings out of the box (feature embedding-out-of-box): the Ollama
      # sidecar serves bge-m3 (MIT, 1024-dim, Cosine). F8_EMBEDDINGS=false opts out
      # (embedding endpoints answer 403; bring-your-own-vector keeps working). Swapping
      # the model means editing this block as one unit - the declared ModelName/Dimension
      # must match what the sidecar serves.
      - Fallen8__Embedding__Enabled=${F8_EMBEDDINGS:-true}
      - Fallen8__Embedding__Backend=Ollama
      - Fallen8__Embedding__ModelName=bge-m3
      - Fallen8__Embedding__Dimension=1024
      - Fallen8__Embedding__IntendedMetric=Cosine
      - Fallen8__Embedding__Ollama__Endpoint=http://ollama:11434
      - Fallen8__Embedding__Ollama__Model=bge-m3
      # Chat gateway out of the box (feature instance-config): the same Ollama sidecar serves
      # the fine-tuned phi4-f8-mini assist model. This is the DEFAULT NL-assist path
      # (browser -> POST /chat -> sidecar). F8_CHAT=false answers 403 (custom browser-direct
      # backends still work). The model must be one the sidecar pulled (F8_DELEGATE_REPO).
      - Fallen8__Chat__Enabled=${F8_CHAT:-true}
      - Fallen8__Chat__Backend=Ollama
      - Fallen8__Chat__Ollama__Endpoint=http://ollama:11434
      - Fallen8__Chat__Ollama__Model=phi4-f8-mini
      # Documents in, graph out (feature unstructured-ingestion): binary formats convert in
      # the docling sidecar below; txt/md ingest without it. F8_INGESTION=false opts out as
      # one unit: the document endpoints answer 403 AND env:up skips the sidecar (compose
      # profile "ingestion").
      - Fallen8__Ingestion__Enabled=${F8_INGESTION:-true}
      - Fallen8__Ingestion__Docling__Endpoint=http://docling:5001
      # NLP enrichment (feature semantic-layer): the nlp sidecar below extracts named entities
      # and key terms per chunk, folded into the entity graph. Part of ingestion; F8_NLP=false
      # turns the capability off AND (via env:up) skips the sidecar. The apiApp is the only caller.
      - Fallen8__Nlp__Enabled=${F8_NLP:-true}
      - Fallen8__Nlp__Endpoint=http://nlp:8100
      # Fleet observability (feature fleet-observability): push metrics + traces + logs to the
      # in-network collector and declare this instance's fleet identity. Always on with env:up;
      # override the identity per deployment (F8_TENANT_ID / F8_INSTANCE_ID / ...).
      - Fallen8__Observability__Otlp__Endpoint=http://otel-collector:4317
      - Fallen8__Identity__Tenant__Id=${F8_TENANT_ID:-local}
      - Fallen8__Identity__Tenant__Name=${F8_TENANT_NAME:-Local}
      - Fallen8__Identity__Instance__Id=${F8_INSTANCE_ID:-f8-local}
      - Fallen8__Identity__Instance__Name=${F8_INSTANCE_NAME:-Fallen-8 (compose)}
    volumes:
      - f8-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - f8-net

  ollama:
    image: ghcr.io/cosh/fallen-8-core-ollama:${F8_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      # The browser calls Ollama directly (nl-assist spec §4); allow the F8 origin
      # (keep in sync with F8_PORT).
      - OLLAMA_ORIGINS=http://localhost:${F8_PORT:-8080}
      # Fine-tune pull sources, tagged locally to the short variant names (phi4-f8-mini / phi4-f8).
      # Override to run your own published fine-tune. phi4-f8 (~9GB, GPU-recommended) is pulled
      # by default alongside the mini; set F8_PULL_PHI4F8=0 to skip it (e.g. CPU-only or
      # disk-constrained hosts).
      - F8_DELEGATE_REPO=${F8_DELEGATE_REPO:-stoic_hellman_728/phi4-f8-mini}
      - F8_PHI4F8_REPO=${F8_PHI4F8_REPO:-stoic_hellman_728/phi4-f8}
      - F8_PULL_PHI4F8=${F8_PULL_PHI4F8:-1}
      # Keep in sync with the fallen8 service's embedding block: when embeddings are on
      # (the default), the sidecar also pulls the bge-m3 embedding model (~1.2 GB once).
      - F8_EMBEDDINGS=${F8_EMBEDDINGS:-true}
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - f8-net

  # Document conversion for unstructured ingestion (feature unstructured-ingestion): binary
  # formats (pdf/docx/xlsx/pptx/html) convert here; the apiApp is the ONLY caller - the
  # browser never talks to docling. CPU image, ~4.4 GB with the bundled layout/OCR models
  # (quay.io/docling-project/docling-serve-cpu, MIT); F8_INGESTION=false skips it via the
  # "ingestion" profile and turns the capability off in one move. No container healthcheck:
  # F8 probes GET /health itself (cached; surfaced on /status as docling.reachable).
  docling:
    # Pinned (not :latest) so the DoclingDocument schema the chunker's fixtures pin against
    # cannot drift under the environment without a deliberate bump. Override with F8_DOCLING_IMAGE.
    image: ${F8_DOCLING_IMAGE:-quay.io/docling-project/docling-serve-cpu:v1.29.0}
    restart: unless-stopped
    profiles: ["ingestion"]
    ports:
      - "${F8_DOCLING_PORT:-5001}:5001"
    networks:
      - f8-net

  # NLP enrichment for the semantic layer (feature nlp-gpu-tier): a small FastAPI + spaCy sidecar,
  # English-only, with the MIT en_core_web_lg model baked in at build so it starts offline. On a
  # GPU host docker-compose.gpu.yml swaps it to the en_core_web_trf transformer on the device.
  # Extracts named entities and key terms per chunk; the apiApp is the ONLY caller (the browser
  # never talks to it). Rides the "nlp" profile: env:up starts it when ingestion is on AND
  # F8_NLP != false, so F8_NLP=false is a true opt-out. No container healthcheck: F8 probes GET
  # /health itself (cached; surfaced on /status as nlp.reachable). Override the model via the
  # F8_NLP_MODEL build ARG (kept in lockstep with the runtime env of the same name).
  nlp:
    # The published image is the CPU tier (linux/amd64 only); the GPU overlay swaps to a
    # local build with the transformer model baked in (docker-compose.gpu.yml).
    image: ghcr.io/cosh/fallen-8-core-nlp:${F8_IMAGE_TAG:-latest}
    build:
      context: ./fallen-8-nlp
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: ["nlp"]
    ports:
      - "${F8_NLP_PORT:-8100}:8100"
    networks:
      - f8-net

  # AI-agent surface (feature mcp-server): a SEPARATE deployable that bridges MCP to the
  # fallen8 service over REST. Part of the default environment, on http://localhost:8090.
  # LOCAL-DEV POSTURE: anonymous and read-only, matching the rest of this environment (fallen8
  # itself runs with no API key here). The container must bind 0.0.0.0 to be reachable, so
  # AcceptAnonymousRemote makes that an explicit, logged decision. For an OFF-BOX deployment do
  # NOT reuse this: set F8_MCP_AUTH_MODE=StaticToken + F8_MCP_TOKEN (or OAuth) and enable only
  # the tiers you need — see docs/mcp-server.md.
  f8-mcp:
    image: ghcr.io/cosh/fallen-8-core-mcp:${F8_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: fallen-8-mcp/Dockerfile
    restart: unless-stopped
    ports:
      - "${F8_MCP_PORT:-8090}:8090"
    environment:
      # The downstream Fallen-8 this bridge points at (in-network) + its own single credential.
      # A caller's token is NEVER forwarded here.
      - Fallen8Target__BaseUrl=http://fallen8:8080
      - Fallen8Target__ApiKey=${F8_API_KEY:-}
      # Reachable bind + explicit acceptance of an anonymous remote surface (the dev default).
      - Mcp__Security__BindAddress=0.0.0.0
      - Mcp__Security__AllowRemoteAccess=true
      - Mcp__Security__AcceptAnonymousRemote=true
      # Caller auth: None by default (dev). Off-box: F8_MCP_AUTH_MODE=StaticToken + F8_MCP_TOKEN.
      - Mcp__Auth__Mode=${F8_MCP_AUTH_MODE:-None}
      - Mcp__Auth__StaticToken=${F8_MCP_TOKEN:-}
      # Tool tiers are least-privilege by default (read-only); opt in per deployment.
      - Mcp__Tools__EnableWrite=${F8_MCP_ENABLE_WRITE:-false}
      - Mcp__Tools__EnableAdmin=${F8_MCP_ENABLE_ADMIN:-false}
      - Mcp__Tools__EnableCode=${F8_MCP_ENABLE_CODE:-false}
      # Fleet observability (feature fleet-observability): push MCP telemetry to the same collector,
      # declaring the SAME identity as the fallen8 instance it fronts, so the fleet dashboards
      # resolve the MCP tool panels under that instance.
      - Mcp__Observability__Otlp__Endpoint=http://otel-collector:4317
      - Mcp__Identity__Tenant__Id=${F8_TENANT_ID:-local}
      - Mcp__Identity__Tenant__Name=${F8_TENANT_NAME:-Local}
      - Mcp__Identity__Instance__Id=${F8_INSTANCE_ID:-f8-local}
      - Mcp__Identity__Instance__Name=${F8_INSTANCE_NAME:-Fallen-8 (compose)}
    depends_on:
      fallen8:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - f8-net

volumes:
  # Explicit names keep the volumes stable regardless of the compose project name (and
  # reuse an already-pulled model set from earlier setups).
  f8-data:
    name: f8-data
  ollama-models:
    name: f8-ollama-models

networks:
  f8-net:
    name: f8-net
    driver: bridge
