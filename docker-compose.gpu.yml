# GPU override: hands the host's NVIDIA GPU(s) to the Ollama sidecar, so NL-assist and
# embedding inference run accelerated. Runtime-only (no image rebuild), which is why it works
# for BOTH the locally built and the published-image environments - `npm run env:up` and
# `npm run env:up:published` (scripts/env-up.js) apply it automatically when a GPU is
# detected. It is a separate file because a device reservation hard-fails container creation
# on hosts without an NVIDIA GPU + container toolkit.
#
# GPU control: set F8_GPU to override automatic detection:
#   F8_GPU=0 npm run env:up          # disable GPU (force CPU-only, even if GPU exists)
#   F8_GPU=1 npm run env:up          # enable GPU (force GPU, fails if not available)
#   npm run env:up                   # auto-detect (default, recommended)
#
# To apply this file by hand:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# The NLP sidecar's GPU tier (the en_core_web_trf transformer) is a BUILD-time variant and
# lives in its own overlay, docker-compose.gpu-nlp.yml: env:up adds it on a GPU host;
# env:up:published cannot (that image is deliberately not published).
#
# AMD GPUs are not covered: Ollama needs the ollama/ollama:rocm image for ROCm.

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
