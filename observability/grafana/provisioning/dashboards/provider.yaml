# Fallen-8 fleet-observability dashboard provider (provisioned as code).
apiVersion: 1

providers:
  - name: fallen8-dashboards
    orgId: 1
    folder: Fallen-8
    folderUid: fallen8
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
