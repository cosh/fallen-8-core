# Tag-driven publishing: pushing a git tag vX.Y.Z is the ONLY trigger and the only manual
# step of a release. The tag is the single source of truth for every version (MinVer derives
# assembly/file/package versions; docker/metadata-action derives the image tags).
#
# DO NOT RENAME THIS FILE. The nuget.org Trusted Publishing policy is bound to the workflow
# filename (release.yml); a rename breaks the OIDC exchange and every push answers 401.
#
# Publish targets, all gated on the full test suite:
#   - GHCR images (GITHUB_TOKEN):  ghcr.io/cosh/fallen-8-core (+ -api, -studio, -mcp,
#     -integrations, -ollama, -nlp), multi-arch except -nlp (see the matrix note).
#   - nuget.org (Trusted Publishing via OIDC - NO stored API key, no fallback):  Fallen-8.
#   - GitHub Packages NuGet feed (GITHUB_TOKEN):  continuity mirror, best-effort.
#   - npm (Trusted Publishing via OIDC - NO stored token; provenance is automatic):
#     @fallen-8/studio, the F8 Studio library artifact and its ./canvas subpath. Needs Node 24;
#     the job comment says why that is not optional.
#   - A GitHub release with generated notes and the package attached.
#
# Everything is idempotent: a re-run overwrites image tags, skips already-pushed package
# versions (--skip-duplicate), and updates an existing GitHub release.

name: release

on:
  push:
    tags:
      # Stable versions only: exactly vX.Y.Z. Pre-release tags would publish a floating
      # `dotnet add package` version, so they deliberately do not trigger this.
      - "v[0-9]+.[0-9]+.[0-9]+"

# Least privilege: no default token scopes; every job declares exactly what it needs.
# id-token: write exists on the two jobs that publish by OIDC instead of by stored key: nuget
# and npm.
permissions: {}

jobs:
  test:
    name: engine + API (restore, build, test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  test-ui:
    name: F8 Studio (typecheck, unit, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: fallen-8-web-ui
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fallen-8-web-ui/package-lock.json
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Typecheck
        run: npx tsc -b
      - name: Unit and component tests
        run: npm test
      - name: Production build
        run: npm run build

  docker:
    name: "image: ${{ matrix.image }}"
    runs-on: ubuntu-latest
    needs: [test, test-ui]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One leg per first-party image the compose environment runs. The dotnet images
          # take the VERSION build arg (MinVer override - no .git in the build context).
          - image: fallen-8-core
            dockerfile: Dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
            build_args: version
            description: "Fallen-8 all-in-one: in-memory graph engine + REST API + F8 Studio"
          - image: fallen-8-core-api
            dockerfile: fallen-8-core-apiApp/Dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
            build_args: version
            description: "Fallen-8 data plane: in-memory graph engine + REST API, UI-less (split topology)"
          - image: fallen-8-core-studio
            dockerfile: fallen-8-web-ui/Dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
            build_args: none
            description: "F8 Studio standalone: the browser UI served by nginx, pointed at any Fallen-8 REST endpoint via F8_API_URL"
          - image: fallen-8-core-mcp
            dockerfile: fallen-8-mcp/Dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
            build_args: version
            description: "Fallen-8 MCP server: Model Context Protocol bridge to the Fallen-8 REST API"
          - image: fallen-8-core-integrations
            dockerfile: fallen-8-integrations/Dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
            build_args: version
            description: "Fallen-8 integrations runtime: runs integration jobs that read a system on your own network and write what they saw into a graph"
          - image: fallen-8-core-ollama
            dockerfile: Dockerfile.ollama
            context: .
            platforms: linux/amd64,linux/arm64
            build_args: none
            description: "Ollama sidecar with Fallen-8 model auto-pull (NL assist, chat, embeddings)"
          # amd64 only: the spaCy/pip dependency chain has no reliable aarch64 wheel story,
          # and emulating pip + the model download under QEMU is slow and flaky. The GPU
          # (en_core_web_trf) tier is likewise NOT published - it stays a local build
          # (docker-compose.gpu-nlp.yml bakes the model at build time).
          - image: fallen-8-core-nlp
            dockerfile: fallen-8-nlp/Dockerfile
            context: fallen-8-nlp
            platforms: linux/amd64
            build_args: none
            description: "Fallen-8 NLP sidecar: FastAPI + spaCy entity and key-term enrichment (CPU tier, linux/amd64 only)"
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # X.Y.Z, X.Y, X, latest (flavor default adds it on semver tags), sha. Note:
          # metadata-action deliberately emits no bare major tag while the major version is
          # 0 (semver declares 0.y.z unstable), so the X tag first appears at v1.0.0.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
          # source/url/version/revision/created labels are auto-generated from the repo;
          # description and licenses are pinned per image so GHCR links back correctly.
          labels: |
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args == 'version' && format('VERSION={0}', steps.meta.outputs.version) || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  nuget:
    name: NuGet package (nuget.org + GitHub Packages)
    runs-on: ubuntu-latest
    needs: [test, test-ui]
    # The ONLY job with id-token: write - the nuget.org Trusted Publishing policy exchanges
    # this workflow's OIDC token for a short-lived push key, validated against THIS workflow
    # in THIS repo (which is why the login step must not move into a reusable workflow).
    # packages: write covers the GitHub Packages continuity push.
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          # MinVer walks the commit history to the version tag.
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Pack (version from the git tag via MinVer)
        run: dotnet pack fallen-8-core/fallen-8-core.csproj --configuration Release -p:ContinuousIntegrationBuild=true --output packages
      # The OIDC exchange happens immediately before the pushes: the token is single-use and
      # the returned key expires after one hour, so it is never fetched early or shared
      # across jobs. If the exchange fails, this step fails the release loudly - there is
      # deliberately NO stored-API-key fallback.
      - name: NuGet login (OIDC Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push package to nuget.org
        run: dotnet nuget push packages/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
      - name: Push symbols to nuget.org
        run: dotnet nuget push packages/*.snupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Push package to GitHub Packages (continuity feed)
        # Best-effort mirror for continuity with the pre-0.0.28 releases on this feed; a
        # hiccup here must not fail a release whose nuget.org push succeeded.
        continue-on-error: true
        run: dotnet nuget push packages/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: packages/

  npm:
    name: "npm package: @fallen-8/studio"
    runs-on: ubuntu-latest
    needs: [test, test-ui]
    # Credential: OIDC Trusted Publishing, like the nuget job. There is NO npm token - the
    # id-token below is exchanged for a short-lived publish right, and npm attaches the
    # provenance attestation automatically (which is also what makes a local `npm publish`
    # refuse: publishing is CI-only by construction).
    #
    # It took a token to get here, once. npm configures a trusted publisher on the PACKAGE's
    # settings page, which does not exist until the package does, and it has no pending-publisher
    # pre-registration - so @fallen-8/studio 0.0.32 was published with a short-lived granular
    # token that was revoked immediately afterwards. Nothing needs that token again.
    #
    # THE VERSION FLOOR IS LOAD-BEARING: trusted publishing needs npm >= 11.5.1, and Node 22
    # bundles npm 10. Below the floor the OIDC handshake does not happen, the registry treats
    # the request as anonymous, anonymous callers cannot PUT, and it fails as
    # "404 Not Found - PUT .../@fallen-8%2fstudio" - which reads exactly like a missing package
    # or a missing credential and sends you looking in the wrong place. Node 24 is here for that
    # reason and nothing else.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: fallen-8-web-ui
    steps:
      - uses: actions/checkout@v5
      # Node 24, NOT the 22 the rest of this repo builds and tests on: see the version floor
      # above. registry-url stays - it writes the .npmrc that points npm at the registry - but
      # no token is fed to it. The dependency cache is deliberately off, which is npm's own
      # advice for a release build: a poisoned cache is a supply-chain problem on the one job
      # whose output is signed and published under this name.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      # The tag is the single source of truth for the version, exactly as MinVer treats it on
      # the .NET side; the committed "0.0.0" is a placeholder that would be obvious if it ever
      # shipped. --no-git-tag-version because the tag already exists.
      - name: Set the version from the git tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Build the library artifact
        run: npm run build:lib
      # One reason to skip, and it must log rather than fail: the version is already on the
      # registry (npm has no --skip-duplicate, and re-running a release must stay idempotent).
      # The old "no credential configured" branch is gone with the token - a missing OIDC right
      # is a real failure now, not something to shrug off.
      - name: Decide whether to publish
        id: gate
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "@fallen-8/studio@$version" version > /dev/null 2>&1; then
            echo "@fallen-8/studio@$version is already on the registry; skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.gate.outputs.publish == 'true'
        run: npm publish

  models:
    name: "Ollama model tags: <ns>/phi4-f8*:vX.Y.Z"
    runs-on: ubuntu-latest
    needs: [test]
    # Tagging the repository tags the published MODELS too, so a release names a specific build
    # instead of whatever ":latest" happens to be. It does not retrain and does not move
    # ":latest" - it adds a second name for the same bytes (scripts/tag-models.sh).
    #
    # SKIPS CLEANLY without the signing key. Publishing weights is the operator's opt-in channel
    # (nl-assist-finetune spec FT-5/FL-4): core ships none, a fork has no key, and neither should
    # fail a release for it. Set the OLLAMA_SIGNING_KEY secret to the private half whose public
    # half is registered at https://ollama.com/settings/keys.
    #
    # Only the mini is tagged by default: a hosted runner has roughly 14 GB free and the 14B is
    # ~9 GB on top of the mini's ~2.5 GB, plus the re-push. Set the F8_TAG_MODELS repository
    # VARIABLE to a space-separated list to change that (the job logs exactly what it tagged).
    permissions: {}
    steps:
      - uses: actions/checkout@v4
      - name: Is a signing key configured?
        id: key
        env:
          OLLAMA_SIGNING_KEY: ${{ secrets.OLLAMA_SIGNING_KEY }}
        run: |
          if [ -n "${OLLAMA_SIGNING_KEY:-}" ]; then
            echo "have=1" >> "$GITHUB_OUTPUT"
          else
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "::notice title=Model tags skipped::OLLAMA_SIGNING_KEY is not set, so the published models keep only their :latest tag. This does not affect the rest of the release."
          fi
      - name: Install ollama
        if: steps.key.outputs.have == '1'
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Tag the published models with ${{ github.ref_name }}
        if: steps.key.outputs.have == '1'
        env:
          OLLAMA_SIGNING_KEY: ${{ secrets.OLLAMA_SIGNING_KEY }}
          F8_TAG_MODELS: ${{ vars.F8_TAG_MODELS || 'stoic_hellman_728/phi4-f8-mini' }}
        run: scripts/tag-models.sh "${{ github.ref_name }}"

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [docker, nuget, npm]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: packages
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # Idempotent: create the release with generated notes only if it does not exist yet,
        # then (re-)attach the package artifacts.
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
          gh release upload "$TAG" packages/*.nupkg packages/*.snupkg --repo "$GITHUB_REPOSITORY" --clobber
