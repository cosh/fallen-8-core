name: build-and-test

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: engine + API (dotnet)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal

  browser:
    name: browser host (trimmed wasm probe)
    runs-on: ubuntu-latest
    # The engine picks its single-threaded arms from HostCapabilities.SupportsBackgroundWork, which is
    # true on every machine the unit suite runs on - so the browser halves of the transaction writer,
    # the checkpoint fan-out, the change-feed teardown and the traversal sweep are executed by NO test.
    # This job is the only thing that runs them. It is a separate job because it needs the wasm-tools
    # workload, and the plain `dotnet build` above must not start requiring that for everyone.
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Install the wasm workload
      run: dotnet workload install wasm-tools
    - name: Publish the probe trimmed (TrimMode=full, no rooted assembly)
      # Publishing is where ILLink reports what the compile-time analyzer cannot see, so this step
      # fails on any trim warning the engine would hand a browser host.
      run: dotnet publish tools/browser-probe -c Release
    - name: Run the probe on the wasm runtime
      # Headless under node, so no browser is needed. The probe's exit code is its verdict.
      run: node tools/browser-probe/bin/Release/net10.0/browser-wasm/AppBundle/main.mjs

  ui:
    name: F8 Studio (typecheck, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fallen-8-web-ui
    steps:
    - uses: actions/checkout@v5
    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: fallen-8-web-ui/package-lock.json
    - name: Install dependencies
      run: npm ci --no-fund --no-audit
    - name: Typecheck
      run: npx tsc -b
    - name: Unit and component tests
      run: npm test
    - name: Production build
      run: npm run build
    - name: Library build (the embed surface + its scoped-CSS/d.ts tripwire)
      run: npm run build:lib

  e2e:
    name: UX scenarios (Playwright vs live apiApp)
    runs-on: ubuntu-latest
    needs: [ backend, ui ]
    defaults:
      run:
        working-directory: fallen-8-web-ui
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: fallen-8-web-ui/package-lock.json
    - name: Install dependencies
      run: npm ci --no-fund --no-audit
    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium
    - name: Run scenarios (builds the SPA into the apiApp and launches it)
      run: npx playwright test
      env:
        CI: 'true'
    - name: Upload traces on failure
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: playwright-results
        path: fallen-8-web-ui/test-results

  embed-smoke:
    name: embed artifact (bare host consumer)
    runs-on: ubuntu-latest
    # Independent of backend/e2e on purpose: this suite needs node and a browser, nothing
    # else - its webServer chain builds the library artifact, installs the host fixture
    # against it (file: dependency, so the exports map and peer resolution are what
    # actually resolve), builds the fixture with a stock vite and serves it statically.
    # Running it in the e2e job would put it behind the dotnet build AND the whole SPA
    # suite for no reason.
    defaults:
      run:
        working-directory: fallen-8-web-ui
    steps:
    - uses: actions/checkout@v5
    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: |
          fallen-8-web-ui/package-lock.json
          fallen-8-web-ui/e2e-embed/host/package-lock.json
    - name: Install dependencies
      run: npm ci --no-fund --no-audit
    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium
    - name: Embed smoke (builds the artifact, installs and builds the host fixture, drives it)
      run: npx playwright test -c playwright.embed.config.ts
      env:
        CI: 'true'
    - name: Upload traces on failure
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: embed-smoke-results
        path: fallen-8-web-ui/test-results

  docker:
    name: all-in-one container (build + smoke test)
    runs-on: ubuntu-latest
    needs: [ backend, ui ]
    steps:
    - uses: actions/checkout@v5
    - name: Validate compose file
      run: docker compose config -q
    - name: Validate split-topology overlay (feature standalone-ui)
      run: docker compose -f docker-compose.yml -f docker-compose.split.yml config -q
    # The gateway overlay is the ONLY gate this file has (no unit test reads a compose file), and
    # the two variables are deliberately NOT symmetric: F8_NAHIL_URL defaults to Nahil's own host
    # root, F8_NAHIL_API_KEY has no default so the overlay fails closed. Both halves are checked,
    # because "it resolves" would pass either way and the asymmetry is the point.
    - name: Validate Nahil overlay - the key alone resolves the profile (feature nahil-backend)
      env:
        F8_NAHIL_API_KEY: ci-placeholder
      run: |
        docker compose -f docker-compose.yml -f docker-compose.nahil.yml config \
          | grep -q 'Fallen8__Chat__Nahil__Endpoint: https://api.nahil.dev'
    - name: Validate Nahil overlay - an explicit endpoint still wins
      env:
        F8_NAHIL_URL: https://models.example
        F8_NAHIL_API_KEY: ci-placeholder
      run: |
        docker compose -f docker-compose.yml -f docker-compose.nahil.yml config \
          | grep -q 'Fallen8__Chat__Nahil__Endpoint: https://models.example'
    - name: Validate Nahil overlay - no credential fails closed
      run: |
        if docker compose -f docker-compose.yml -f docker-compose.nahil.yml config -q 2>/dev/null; then
          echo "the overlay resolved without F8_NAHIL_API_KEY; it must fail closed" >&2
          exit 1
        fi
    - name: Build image (engine + API + UI)
      run: docker build -t fallen-8:ci .
    - name: Smoke-test the container
      run: |
        docker run -d --name f8 -p 8080:8080 \
          -e Fallen8__Durability__Volatile=true \
          -e Fallen8__Security__ApiKey=ci-key \
          fallen-8:ci
        for i in $(seq 1 30); do
          curl -sf http://localhost:8080/ > /dev/null && break
          sleep 2
        done
        echo "--- SPA shell is served"
        curl -sf http://localhost:8080/ | grep -qi "<!doctype html"
        # F8Black.svg: the one logo still in public/ (F8White.svg moved into src/assets so
        # the embed artifact inlines it; the SPA serves it hashed, not at the root).
        curl -sf http://localhost:8080/F8Black.svg > /dev/null
        echo "--- engine answers"
        curl -sf -H "Authorization: Bearer ci-key" http://localhost:8080/status | grep -q vertexCount
        echo "--- structured benchmark (namespace-scoped: these two routes have no bare alias)"
        curl -sf -H "Authorization: Bearer ci-key" "http://localhost:8080/ns/default/generate?nodeCount=50&edgeCount=2" | grep -q verticesCreated
        curl -sf -H "Authorization: Bearer ci-key" "http://localhost:8080/ns/default/benchmark?iterations=2" | grep -q averageTps
        # The bare form must be REFUSED, not served against "default" (-f would fail on the 400, so
        # ask for the body and match the problem title).
        curl -s -H "Authorization: Bearer ci-key" "http://localhost:8080/generate?nodeCount=1&edgeCount=1" | grep -q "Namespace required"
        echo "--- delegate validation compiles in-container"
        curl -sf -X POST -H "Authorization: Bearer ci-key" -H "Content-Type: application/json" \
          -d '{"delegateKind":"VertexFilter","fragment":"return (v) => v.Label == \"person\";"}' \
          http://localhost:8080/delegates/validate | grep -q '"valid":true'
    - name: Container logs
      if: always()
      run: docker logs f8 --tail 50 || true
    - name: Cleanup
      if: always()
      run: docker rm -f f8 || true

  docker-ui:
    name: standalone F8 Studio image (build + smoke test)
    runs-on: ubuntu-latest
    needs: [ ui ]
    steps:
    - uses: actions/checkout@v5
    - name: Build the standalone UI image (feature standalone-ui)
      run: docker build -f fallen-8-web-ui/Dockerfile -t f8-studio:ci .
    - name: Smoke-test the standalone UI
      run: |
        docker run -d --name f8-studio -p 3000:80 -e F8_API_URL=http://localhost:8080 f8-studio:ci
        for i in $(seq 1 30); do
          curl -sf http://localhost:3000/config.js > /dev/null && break
          sleep 2
        done
        echo "--- config.js carries the injected apiUrl with no-store"
        curl -si http://localhost:3000/config.js | grep -qi "cache-control: no-store"
        curl -sf http://localhost:3000/config.js | grep -q "http://localhost:8080"
        echo "--- SPA shell + client-route deep-link fallback"
        curl -sf http://localhost:3000/ | grep -qi "<!doctype html"
        test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/q/default/browser)" = "200"
        echo "--- bundled samples served"
        curl -sf http://localhost:3000/samples/index.json > /dev/null
    - name: Standalone UI logs
      if: always()
      run: docker logs f8-studio --tail 30 || true
    - name: Cleanup
      if: always()
      run: docker rm -f f8-studio || true
