# Split-topology overlay (feature standalone-ui): decouple F8 Studio from the data plane.
#
# Applied ON TOP of docker-compose.yml (never alone), and applied unconditionally by
# scripts/env-up.js - so THIS IS WHAT `npm run env:up` RUNS. The equivalent by hand:
#   docker compose -f docker-compose.yml -f docker-compose.split.yml up
#
# It re-tasks the single `fallen8` service to serve the REST API ONLY (the UI-less apiApp image)
# and adds a separate `f8-studio` nginx container that talks to it over REST from the browser. All
# base sidecars (ollama, embeddings, chat) are reused unchanged - nothing is duplicated. The
# all-in-one image that bakes the SPA into wwwroot is what a raw `docker compose up` (no -f
# overlay) still gives you.
services:
  # Data plane, UI-less. Override the BUILD to the apiApp Dockerfile: the base uses `build: .`,
  # the all-in-one image that bakes the SPA into wwwroot, and overriding `image:` alone would not
  # change that. Everything else (Ollama/embedding/chat wiring, volume, network, restart policy)
  # is inherited from docker-compose.yml.
  fallen8:
    # Override the BUILD to the UI-less apiApp Dockerfile: the base uses `build: .`, the all-in-one
    # image that bakes the SPA into wwwroot. The apiApp image installs curl, so the base /status
    # healthcheck applies unchanged here (and f8-mcp's service_healthy dependency stays satisfied).
    # The IMAGE is overridden too: without it, a local build of this UI-less variant would be
    # tagged with the base's all-in-one GHCR name.
    image: ghcr.io/cosh/fallen-8-core-api:${F8_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: fallen-8-core-apiApp/Dockerfile
    environment:
      # Allow the standalone UI's browser origin (CORS is deny-all by default). INDEXED form: a
      # bare Fallen8__Security__AllowedCorsOrigins=... does NOT bind the String[].
      #
      # BOTH loopback spellings, because they are the same UI and a browser treats them as two
      # origins. Listing only one is a trap with no useful diagnosis at the far end: on Windows,
      # localhost resolves to ::1 first, so when a published port's IPv6 forward is broken the
      # obvious move is to retype the address as 127.0.0.1 - which fixes the transport and then
      # silently fails CORS instead, because the PAGE origin changed too. Same machine, same UI,
      # same trust: this widens nothing.
      - Fallen8__Security__AllowedCorsOrigins__0=http://localhost:${F8_UI_PORT:-8081}
      - Fallen8__Security__AllowedCorsOrigins__1=http://127.0.0.1:${F8_UI_PORT:-8081}

  # The Ollama server must also accept the standalone UI origin for browser-direct NL-assist
  # (OLLAMA_ORIGINS is read by the ollama server, NOT the apiApp). Keep the all-in-one origin too.
  ollama:
    environment:
      - OLLAMA_ORIGINS=http://localhost:${F8_PORT:-8080},http://localhost:${F8_UI_PORT:-8081},http://127.0.0.1:${F8_PORT:-8080},http://127.0.0.1:${F8_UI_PORT:-8081}

  # The decoupled UI: nginx serving the built SPA, pointed at the data plane's PUBLISHED host port
  # (the browser reaches localhost:F8_PORT, never the in-network name). F8_UI_PORT (default 8081)
  # is overridable; 8081 avoids the API (8080) and Grafana (3000), so this can run alongside the
  # observability stack in the default env:up.
  f8-studio:
    image: ghcr.io/cosh/fallen-8-core-studio:${F8_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: fallen-8-web-ui/Dockerfile
    restart: unless-stopped
    ports:
      - "${F8_UI_PORT:-8081}:80"
    environment:
      - F8_API_URL=http://localhost:${F8_PORT:-8080}
    depends_on:
      fallen8:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/config.js"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - f8-net
